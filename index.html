<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PilotSwap: Simple. Secure. Decentralized. A testnet token swap interface." />
    <meta name="theme-color" content="#F4F8FF" />
    <script>
      /* Apply the saved/system theme before first paint to avoid a light flash. */
      (function () {
        try {
          var t = localStorage.getItem("pilotswap-theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
        } catch (e) {}
      })();
    </script>
    <title>PilotSwap | Simple. Secure. Decentralized.</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
